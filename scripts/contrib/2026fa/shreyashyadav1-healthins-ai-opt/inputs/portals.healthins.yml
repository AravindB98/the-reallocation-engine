# Boards for the healthins-ai-opt mode. Public job-board APIs only (Greenhouse, Lever, Ashby).
# Same shape as data/ats/portals.example.yml, so `npm run ats:scan -- --dry-run` can read it:
#
#   REALLOCATION_ENGINE_PORTALS=scripts/contrib/2026fa/shreyashyadav1-healthins-ai-opt/inputs/portals.healthins.yml \
#     npm run ats:scan -- --dry-run
#
# Two extra fields per board, both the human's (your-input), neither a record:
#   csv_company  the legal entity the person believes runs this board. The entity gate checks
#                that this name resolves to exactly ONE row of the 80 Days CSV. It is never
#                fuzzy-matched: a wrong claim comes back "not found", not "close enough".
#   bucket       hiring-loop size: startup (<200 staff), midsize (200-1,000), large (>1,000).
#                Approximate, from public knowledge on 2026-10-20, not verified. Edit freely;
#                the report prints how many days of slack each bucket leaves.
#
# How the boards were found, and what that does and does not show:
#   - 7 boards: the repo's detector, `python3 scripts/ats/detect-ats.py --csv <105 in-sector sponsors>`
#     (Greenhouse + Lever only). It found 8 of 105; the eighth, Gynesonics, has no openings and is left out.
#   - 13 more: a probe of 165 candidate slugs (website labels and normalised names from the sponsor list, plus a
#     hand-typed list of insurtech and health-AI names) on all three board APIs, saved as tools/discover-boards.mjs.
#     35 boards answered (evidence/05); 20 of the 32 below are among them (these 13 and the detector's 7).
#   - 12 added by name from the author's own list of well-known insurance and health companies: Zocdoc, Flatiron
#     Health, Cohere Health, Clarify Health, Lemonade, Commure, Oscar Health, Clover Health, Komodo Health, Abridge,
#     Headway, Cedar. The author saw that these boards answer; no transcript of that was kept.
# Nothing here shows that a board belongs to the company it is named for. No script checks that. The entity gate checks
# only that the claimed name exists in the CSV, and the report shows a board-name-versus-website hint. A one-off look at
# posting text for some boards was not kept and is not counted as evidence.
# Boards the detector or the probe could not find (Workday, iCIMS, custom sites) are NOT here.

# Read by `npm run ats:scan` only. ingest.mjs ignores it and applies the rules in lib.mjs and the persona instead,
# so the scan CLI and ingest.mjs can be compared on total offers per board (the provider layer is shared).
title_filter:
  positive: ["software", "developer", "machine learning", "data engineer", "platform engineer", "full stack", "fullstack", "full-stack", "backend", "back-end", "frontend", "front-end", "llm", "nlp"]
  negative: ["intern"]

tracked_companies:
  # ── in-sector sponsors found by the repo's detector ──
