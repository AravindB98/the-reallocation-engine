  - { name: Omada Health,          enabled: true, provider: greenhouse, careers_url: "https://job-boards.greenhouse.io/omadahealth",   csv_company: "Omada Health, Inc.",             bucket: midsize }
  - { name: Outset Medical,        enabled: true, provider: greenhouse, careers_url: "https://job-boards.greenhouse.io/outsetmedical", csv_company: "Outset Medical, Inc.",           bucket: midsize }
  - { name: Veracyte,              enabled: true, provider: greenhouse, careers_url: "https://job-boards.greenhouse.io/veracyte",      csv_company: "Veracyte, Inc.",                 bucket: midsize }
  - { name: Welbe Health,          enabled: true, provider: greenhouse, careers_url: "https://job-boards.greenhouse.io/welbehealth",   csv_company: "Welbe Health LLC",               bucket: midsize }
  - { name: Cala Health,           enabled: true, provider: greenhouse, careers_url: "https://job-boards.greenhouse.io/calahealth",    csv_company: "Cala Health, Inc.",              bucket: startup }
  - { name: Akero Therapeutics,    enabled: true, provider: greenhouse, careers_url: "https://job-boards.greenhouse.io/akerotherapeutics", csv_company: "Akero Therapeutics, Inc.",   bucket: midsize }

  # ── found by hand, not by the detector. Seven are filed under codes outside the sector filter (Other Technology or
